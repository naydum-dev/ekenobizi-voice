<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default SEO fallback (react-helmet-async overrides these per page) -->
    <title>Ekenobizi Voice</title>
    <meta
      name="description"
      content="Ekenobizi Voice is the community blog for Ekenobizi in Umuahia, Abia State — sharing stories, news, and voices from our five villages."
    />

    <!-- Default Open Graph fallback -->
    <meta property="og:site_name" content="Ekenobizi Voice" />
    <meta property="og:title" content="Ekenobizi Voice" />
    <meta
      property="og:description"
      content="Ekenobizi Voice is the community blog for Ekenobizi in Umuahia, Abia State — sharing stories, news, and voices from our five villages."
    />
    <meta
      property="og:image"
      content="https://ekenobizi-voice.vercel.app/hero.jpg"
    />
    <meta property="og:url" content="https://ekenobizi-voice.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ekenobizi Voice" />
    <meta
      name="twitter:description"
      content="Ekenobizi Voice is the community blog for Ekenobizi in Umuahia, Abia State — sharing stories, news, and voices from our five villages."
    />
    <meta
      name="twitter:image"
      content="https://ekenobizi-voice.vercel.app/hero.jpg"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
